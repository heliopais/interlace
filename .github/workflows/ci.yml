name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check src tests

      # mypy is configured for python_version = "3.13" (see [tool.mypy]) and
      # type-checks against the numpy stubs installed in the active env. On the
      # 3.10 matrix leg the resolved numpy (2.2.6) ships ndarray TypeVars
      # without PEP 696 defaults, so bare `np.ndarray` trips disallow_any_generics.
      # Run mypy once on 3.13 (numpy 2.4.3, stubs with defaults); runtime
      # behaviour on older Pythons is covered by the test step below.
      - name: Type check
        if: matrix.python-version == '3.13'
        run: uv run mypy

      - name: Test
        run: uv run pytest

  pandas-free:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install without pandas
        run: |
          uv venv .venv-no-pandas
          uv pip install --python .venv-no-pandas/bin/python \
            ".[bobyqa]" polars pytest

      - name: Run pandas-free tests
        run: |
          .venv-no-pandas/bin/python -m pytest tests/test_polars_only.py -v

  cholmod:
    # Exercise the CHOLMOD path against scikit-sparse >= 0.5 to guard against
    # upstream API breaks (regression for GitHub #11: sksparse 0.5 changed
    # cholmod.cholesky() to return a tuple, which broke v0.2.5).
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install system CHOLMOD (SuiteSparse)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsuitesparse-dev

      - name: Install with scikit-sparse (via [fast] extra)
        run: |
          uv venv .venv-cholmod
          uv pip install --python .venv-cholmod/bin/python \
            ".[fast]" pandas pytest "scikit-sparse>=0.5"

      - name: Run cholmod tests
        run: |
          .venv-cholmod/bin/python -m pytest tests/test_cholmod.py tests/test_cholmod_warn.py -v
