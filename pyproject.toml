[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "interlace-lme"
dynamic = ["version"]
description = "Mixed-effects models in Python: LMM, GLMM, CLMM, and Cox frailty with crossed random effects, validated against R"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "statsmodels>=0.14",
    "formulaic>=0.6",
    "numpy>=1.26",
    "scipy>=1.12",
    "narwhals>=1.0",
    "tqdm>=4.67.3",
    "plotnine>=0.15.3",
]

[project.urls]
Homepage = "https://github.com/heliopais/interlace"
Documentation = "https://heliopais.github.io/interlace/"
Issues = "https://github.com/heliopais/interlace/issues"

[project.optional-dependencies]
bobyqa = ["Py-BOBYQA>=1.4"]
cholmod = ["scikit-sparse>=0.4"]
fast = ["scikit-sparse>=0.4"]
smooth = ["scikit-misc>=0.4"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "mypy==1.19.1",
    "pandas>=2.0",
    # pandas-stubs >=3.0 requires Python >=3.11; for 3.10 dev environments,
    # fall back to the latest 2.x line (mypy authoritatively runs on 3.13 in CI).
    "pandas-stubs>=3.0.0.260204; python_version >= '3.11'",
    "pandas-stubs>=2.2,<3.0; python_version < '3.11'",
    "types-tqdm>=4.67.0",
    "polars>=1.0",
    "narwhals>=1.0",
    "pytest-cov>=7.1.0",
    "nbconvert>=7.17.1",
    "ipykernel>=7.2.0",
    "llm-tldr>=0.1",
]
docs = [
    "sphinx>=8.0",
    "furo>=2024.8.6",
    "sphinx-copybutton>=0.5",
    "sphinx-external-toc>=1.0",
    "sphinx-autodoc-typehints>=2.0",
    "myst-nb>=1.1",
    "ipykernel>=6.0",
    "sphinxext-opengraph>=0.9",
    "sphinx-design>=0.6",
    "sphinx-sitemap>=2.5",
    "sphinx-gitstamp>=0.4",
    "sphinx-notfound-page>=1.0",
    "sphinxcontrib-mermaid>=0.9",
]

[tool.hatch.version]
source = "vcs"
raw-options = {version_scheme = "no-guess-dev", local_scheme = "no-local-version"}

[tool.hatch.build.hooks.vcs]
version-file = "src/interlace/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/interlace"]

[tool.ruff]
src = ["src"]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.mypy]
# mypy runs on the highest supported Python in CI (3.13). The runtime
# floor is 3.10 (see ``requires-python``); per-version compatibility is
# verified by running the actual test suite on the CI matrix instead.
python_version = "3.13"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["statsmodels", "statsmodels.*", "scipy", "scipy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["plotnine", "plotnine.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["interlace.plotting"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["tqdm", "tqdm.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pybobyqa"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["patsy", "patsy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["formulaic", "formulaic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
